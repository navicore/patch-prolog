name: CI - Linux

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# This workflow ONLY calls `just` commands. The justfile is the source
# of truth for all build/test/lint logic, preventing drift between
# local development and CI.
#
# `runs-on: navicore-rust` targets the custom job image at
# git.navicore.tech/navicore/navicore-forgejo-runner:latest, which has
# Rust 1.95.0, clang-19, and just pre-installed.

jobs:
  ci-linux:
    name: CI - Linux x86_64
    runs-on: navicore-rust

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Verify toolchain
      run: |
        rustc --version
        cargo --version
        cargo clippy --version
        clang --version
        just --version

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: linux-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: linux-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    # NOTE: We intentionally do NOT cache target/ because compiled tests
    # contain language semantics. When builtins change, stale cached test
    # binaries cause false failures.

    - name: Install cargo-deny
      run: |
        curl -sL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
          | tar xz -C ~/.cargo/bin --strip-components=1 --wildcards '*/cargo-deny'
        cargo deny --version

    - name: Run CI checks (just ci)
      run: just ci
