[book]
title = "patch-prolog"
description = "A standalone ISO-subset Prolog compiler (plgc / plgr / plgl)"
authors = ["Ed Sweeney"]
src = "docs"
language = "en"

[build]
build-dir = "book"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://git.navicore.tech/navicore/patch-prolog"
edit-url-template = "https://git.navicore.tech/navicore/patch-prolog/_edit/main/docs/{path}"
site-url = "/patch-prolog/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
boost-hierarchy = 2
