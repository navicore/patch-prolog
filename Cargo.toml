[workspace]
members = ["crates/shared", "crates/frontend", "crates/runtime", "crates/compiler", "crates/lsp", "crates/repl"]
resolver = "2"

[workspace.package]
version = "0.4.4"
edition = "2024"
authors = ["Ed Sweeney <ed@onextent.com>"]
license = "MIT"
documentation = "https://docs.navicore.tech/patch-prolog/"
repository = "https://git.navicore.tech/navicore/patch-prolog"

[workspace.dependencies]
# CLI (compiler only — never linked into plg-runtime, to protect compiled-binary size)
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Build-script TOML parsing (version-sync enforcement)
toml = "1.0"

# LSP server (plg-lsp / `plgl` only — isolated from the runtime/compiled-binary
# dependency graph; the no-heavy-deps rule applies to plg-shared/plg-runtime).
tower-lsp = "0.20"
tokio = { version = "1", features = ["io-std", "macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# REPL (plg-repl / `plgr` only — TUI deps, isolated from the
# runtime/compiled-binary graph like the LSP deps above).
ratatui = "0.30"
crossterm = "0.29"
shlex = "2.0"
# vim-motion line editor (patch-seq's crate). Caret major: lockfile pins
# the exact 7.x; `cargo update` moves within `<8.0.0` only when we choose.
vim-line = "7"

# Testing
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
